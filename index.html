<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>firm-shake</title>

    <base href="/" />

    <meta http-equiv="Cache-Control" content="no-cache" />
    <meta name="color-scheme" content="light dark" />

    <script>
      (function () {
        var STORAGE_KEY = 'firmshake.themePreference';
        var DARK_CLASS = 'ion-palette-dark';

        try {
          var preference = localStorage.getItem(STORAGE_KEY);
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var useDark = preference === 'dark' || ((preference === 'system' || preference !== 'light') && prefersDark);
          if (useDark) {
            document.documentElement.classList.add(DARK_CLASS);
          }
        } catch (error) {
          /* ignore storage failures during boot */
        }
      })();
    </script>
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- add to homescreen for ios -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="firm-shake" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <script>
      (function () {
        var RELOAD_KEY = 'firmshake:bootstrap-reload';
        var RELOAD_COUNT_KEY = 'firmshake:bootstrap-reload-count';
        var BUILD_KEY = 'firmshake:app-build';
        var MAX_BOOTSTRAP_RELOADS = 2;

        function reloadOnce() {
          var reloadCount = parseInt(sessionStorage.getItem(RELOAD_COUNT_KEY) || '0', 10);
          if (reloadCount >= MAX_BOOTSTRAP_RELOADS) {
            return false;
          }
          if (sessionStorage.getItem(RELOAD_KEY)) {
            return false;
          }
          sessionStorage.setItem(RELOAD_COUNT_KEY, String(reloadCount + 1));
          sessionStorage.setItem(RELOAD_KEY, '1');
          var path = window.location.pathname + window.location.search + window.location.hash;
          window.location.assign(path || '/');
          return true;
        }

        function isStaleModuleError(message, source) {
          var text = ((message || '') + ' ' + (source || '')).toLowerCase();
          return text.indexOf('mime type') !== -1
            || text.indexOf('module script') !== -1
            || text.indexOf('failed to fetch dynamically imported module') !== -1
            || text.indexOf('importing a module script failed') !== -1
            || text.indexOf('error loading dynamically imported module') !== -1
            || text.indexOf('expected a javascript') !== -1;
        }

        window.addEventListener('error', function (event) {
          var target = event.target;
          if (target && target.tagName === 'SCRIPT') {
            reloadOnce();
            return;
          }
          if (isStaleModuleError(event.message, event.filename)) {
            reloadOnce();
          }
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          var message = reason instanceof Error ? reason.message : String(reason);
          if (isStaleModuleError(message, '')) {
            if (reloadOnce()) {
              event.preventDefault();
            }
          }
        });

        function syncBuildVersion() {
          var buildMeta = document.querySelector('meta[name="app-build"]');
          if (!buildMeta) {
            return;
          }

          var build = buildMeta.getAttribute('content') || '';
          var previous = sessionStorage.getItem(BUILD_KEY);
          if (previous && previous !== build) {
            sessionStorage.setItem(BUILD_KEY, build);
            reloadOnce();
            return;
          }
          sessionStorage.setItem(BUILD_KEY, build);
        }

        syncBuildVersion();

        window.addEventListener('pageshow', function (event) {
          if (!event.persisted) {
            return;
          }
          syncBuildVersion();
        });
      })();
    </script>
  </head>

  <body>
    <div id="app">
      <!-- Instant shell before JS — removed when Vue mounts -->
      <div id="app-boot-shell" aria-busy="true" aria-label="Loading FirmShake">
        <style>
          #app-boot-shell {
            --boot-bg: #f4f5f8;
            --boot-surface: #ffffff;
            --boot-muted: #92949c;
            --boot-border: #d7d8da;
            --boot-shimmer: #e8e9eb;
            box-sizing: border-box;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            background: var(--boot-bg);
            color: #000;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
          }
          @media (prefers-color-scheme: dark) {
            #app-boot-shell {
              --boot-bg: #000000;
              --boot-surface: #1c1c1e;
              --boot-muted: #98989d;
              --boot-border: #38383a;
              --boot-shimmer: #2c2c2e;
              color: #ffffff;
            }
          }
          html.ion-palette-dark #app-boot-shell {
            --boot-bg: #000000;
            --boot-surface: #1c1c1e;
            --boot-muted: #98989d;
            --boot-border: #38383a;
            --boot-shimmer: #2c2c2e;
            color: #ffffff;
          }
          #app-boot-shell *,
          #app-boot-shell *::before,
          #app-boot-shell *::after {
            box-sizing: border-box;
          }
          .boot-header {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--boot-surface);
            border-bottom: 1px solid var(--boot-border);
            font-size: 17px;
            font-weight: 600;
          }
          .boot-content {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
          }
          .boot-bar {
            height: 40px;
            border-radius: 8px;
            background: var(--boot-shimmer);
          }
          .boot-row {
            display: flex;
            gap: 12px;
            align-items: center;
          }
          .boot-thumb {
            width: 72px;
            height: 72px;
            border-radius: 8px;
            background: var(--boot-shimmer);
            flex-shrink: 0;
          }
          .boot-lines {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
          }
          .boot-line {
            height: 14px;
            border-radius: 4px;
            background: var(--boot-shimmer);
          }
          .boot-line.short { width: 55%; }
          .boot-line.shorter { width: 35%; }
          .boot-tabs {
            display: flex;
            background: var(--boot-surface);
            border-top: 1px solid var(--boot-border);
            padding: 6px 0 calc(6px + env(safe-area-inset-bottom, 0px));
          }
          .boot-tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            color: var(--boot-muted);
          }
          .boot-tab-icon {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            background: var(--boot-shimmer);
          }
          .boot-tab:first-child .boot-tab-icon {
            background: #3880ff;
            opacity: 0.35;
          }
          .boot-tab.active .boot-tab-icon {
            background: #3880ff;
            opacity: 0.85;
          }
          .boot-tab.active {
            color: #3880ff;
          }
        </style>
        <header class="boot-header" id="boot-header">Browse</header>
        <main class="boot-content">
          <div class="boot-bar"></div>
          <div class="boot-row">
            <div class="boot-thumb"></div>
            <div class="boot-lines">
              <div class="boot-line"></div>
              <div class="boot-line short"></div>
              <div class="boot-line shorter"></div>
            </div>
          </div>
          <div class="boot-row">
            <div class="boot-thumb"></div>
            <div class="boot-lines">
              <div class="boot-line"></div>
              <div class="boot-line short"></div>
              <div class="boot-line shorter"></div>
            </div>
          </div>
        </main>
        <nav class="boot-tabs" aria-hidden="true">
          <div class="boot-tab"><div class="boot-tab-icon"></div><span>Browse</span></div>
          <div class="boot-tab"><div class="boot-tab-icon"></div><span>Saved</span></div>
          <div class="boot-tab"><div class="boot-tab-icon"></div><span>Buying</span></div>
          <div class="boot-tab"><div class="boot-tab-icon"></div><span>Selling</span></div>
          <div class="boot-tab"><div class="boot-tab-icon"></div><span>Inbox</span></div>
        </nav>
        <script>
          (function () {
            var titles = {
              '/tabs/home': 'Browse',
              '/tabs/savedlistings': 'Saved',
              '/tabs/buying': 'Buying',
              '/tabs/selling': 'Selling',
              '/tabs/inbox': 'Inbox',
              '/tabs/profile': 'Settings',
              '/logs': 'Debug logs'
            };
            var tabOrder = ['Browse', 'Saved', 'Buying', 'Selling', 'Inbox'];
            var path = (window.location.pathname || '').replace(/\/$/, '') || '/';
            var title = titles[path];
            if (!title) {
              return;
            }
            document.title = 'firm-shake - ' + title;
            var header = document.getElementById('boot-header');
            if (header) {
              header.textContent = title;
            }
            // /logs is not a tab — hide the tab bar skeleton so a stuck boot
            // shell does not look like a blank Browse screen.
            if (path === '/logs') {
              var tabsNav = document.querySelector('#app-boot-shell .boot-tabs');
              if (tabsNav) {
                tabsNav.style.display = 'none';
              }
              return;
            }
            var activeIndex = tabOrder.indexOf(title);
            if (activeIndex >= 0) {
              var tabs = document.querySelectorAll('#app-boot-shell .boot-tab');
              if (tabs[activeIndex]) {
                tabs[activeIndex].classList.add('active');
              }
              if (tabs[0] && activeIndex !== 0) {
                var firstIcon = tabs[0].querySelector('.boot-tab-icon');
                if (firstIcon) {
                  firstIcon.style.background = '';
                  firstIcon.style.opacity = '';
                }
              }
            }
          })();
        </script>
      </div>
    </div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>

</html>
